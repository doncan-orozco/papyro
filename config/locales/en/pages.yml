        eyebrow: "Our Story"
        title: "Papyro is built for ideas worth reading"
        intro: "In a world of algorithmic feeds and engagement bait, Papyro is a quiet alternative. We built it for writers who value depth over noise, and readers who want to slow down."
        philosophy_title: "Why we built this"
        philosophy_body: "Most publishing platforms optimize for virality. We optimize for clarity. Papyro gives writers a focused, distraction-free space to publish and readers a curated feed free from manipulation. No likes, no vanity metrics, no dark patterns."
        built_for_title: "Built for the long read"
        built_for_body: "We believe the best ideas deserve more than a tweet. Papyro supports long-form writing with a clean editor, thoughtful typography, and zero friction between a draft and a published post. It is an app crafted end to end with product care and technical rigor."
