        bio_paragraph_1: "Ingeniero de software con un historial comprobado de diseño e implementación de soluciones escalables. Especializado en desarrollo full-stack con Ruby on Rails, tecnologías frontend modernas e infraestructura en la nube. Apasionado por escribir código limpio y mantenible, y resolver desafíos técnicos complejos."
        bio_paragraph_2: "Tengo experiencia práctica construyendo sistemas listos para producción, optimizando el rendimiento de aplicaciones y mentorando equipos de desarrollo. Me impulsa la oportunidad de aprovechar la tecnología para crear un impacto significativo y mejorar las experiencias del usuario."
        bio_paragraph_3: "Más allá de la programación, estoy comprometido con el aprendizaje continuo, contribuyendo a proyectos de código abierto y compartiendo conocimiento con la comunidad de desarrollo."
