        designer_name: "Martha Olan"
        designer_linkedin_label: "Perfil de LinkedIn de Martha Olan"
        designer_role: "Diseñadora de Producto"
        designer_bio: "Define la experiencia del producto, la dirección de la interfaz y las decisiones de diseño que mantienen a Papyro sereno, útil y elegante."
        join_title: "Ven a escribir con nosotros"
        join_body: "Papyro está en beta privada. Estamos invitando a escritores de forma reflexiva, uno a la vez. Si quieres publicar aquí, envíanos una nota a info@papyro.net y cuéntanos sobre qué quieres escribir."
        join_cta: "Solicita una invitación"
