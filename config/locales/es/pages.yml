    about:
      index:
        eyebrow: "Nuestra Historia"
        title: "Papyro está creado para ideas que merecen ser leídas"
        intro: "En un mundo de feeds artificiales y contenido diseñado para el clic, Papyro es una alternativa serena. Lo creamos para escritores que valoran la profundidad sobre el ruido, y para lectores que buscan bajar el ritmo."
        philosophy_title: "Por qué creamos esto"
        philosophy_body: "La mayoría de las plataformas de publicación priorizan la viralidad. Nosotros priorizamos la claridad. Papyro ofrece a los escritores un espacio de concentración y sin distracciones para publicar, y a los lectores un feed seleccionado con cuidado y libre de manipulación. Sin likes, sin métricas de vanidad, sin patrones oscuros."
        built_for_title: "Diseñado para los formatos largos"
        built_for_body: "Creemos que las mejores ideas merecen más que un tuit. Papyro está pensado para la escritura de formato largo, con un editor limpio, tipografía cuidada y cero fricción entre el borrador y la publicación. Es una plataforma diseñada de principio a fin con visión de producto y rigor técnico."
        team_eyebrow: "Construido por"
        engineer_name: "Doncan Orozco"
        engineer_linkedin_label: "Perfil de LinkedIn de Doncan Orozco"
        engineer_role: "Ingeniero de Software"
        engineer_bio: "Diseñó la arquitectura y desarrolló toda la aplicación, desde la implementación del producto hasta la infraestructura y los flujos de despliegue."
        designer_name: "Martha Olan"
        designer_linkedin_label: "Perfil de LinkedIn de Martha Olan"
        designer_role: "Diseñadora de Producto"
        designer_bio: "Define la experiencia del usuario, la dirección de la interfaz y las decisiones de diseño que hacen de Papyro un espacio sereno, útil y elegante."
        join_title: "Ven a escribir con nosotros"
        join_body: "Papyro está en beta privada. Estamos invitando escritores de manera selectiva y cuidadosa, uno a la vez. Si quieres publicar aquí, envíanos un mensaje a info@papyro.net y cuéntanos sobre qué te gustaría escribir."
        join_cta: "Solicita una invitación"
