    about:
      index:
        eyebrow: "Nuestra Historia"
        title: "Papyro está construido para ideas que valen la pena leer"
        intro: "En un mundo de feeds algorítmicos y contenido diseñado para el clic, Papyro es una alternativa tranquila. Lo construimos para escritores que valoran la profundidad sobre el ruido, y lectores que quieren desacelerar."
        philosophy_title: "Por qué construimos esto"
        philosophy_body: "La mayoría de las plataformas de publicación optimizan para la viralidad. Nosotros optimizamos para la claridad. Papyro le da a los escritores un espacio enfocado y sin distracciones para publicar, y a los lectores un feed seleccionado libre de manipulación. Sin likes, sin métricas de vanidad, sin patrones oscuros."
        built_for_title: "Construido para la lectura larga"
        built_for_body: "Creemos que las mejores ideas merecen más que un tuit. Papyro soporta escritura de formato largo con un editor limpio, tipografía cuidadosa y cero fricción entre un borrador y una publicación. Es una aplicación elaborada de extremo a extremo con cuidado de producto y rigor técnico."
        team_eyebrow: "Construido por"
        engineer_name: "Doncan Orozco"
        engineer_linkedin_label: "Perfil de LinkedIn de Doncan Orozco"
        engineer_role: "Ingeniero de Software"
